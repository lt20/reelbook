name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/config.js
      - run: node --check app/sw.js
      - run: node --check app/sessions.js
      - run: node --check app/sheet.js
      # every app test, the acceptance tests written by Codex, and the tests of the Codex scripts
      - run: node --test tests/*.cjs tests/acceptance/*/*.test.cjs scripts/tests/*.test.mjs
  rb-py:
    # Python 3.9 (the installer's floor) is not built for Ubuntu 26.04 runners
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: bash -n tools/nightly.sh
      - run: python -m py_compile tools/rb.py tools/crop.py tools/vstack.py
      # every rb.py test file (rb-sessions, rb-queue, rb-search, rb-themes…), so a new one never stays out of CI
      - run: for f in tests/rb-*.test.py; do echo "== $f"; python -I "$f" -v || exit 1; done
